sampling:
  - layer: 1
    neighbor: 
      - 10
    strategy: 'recent'
    prop_time: False
    history: 1
    duration: 0
    num_thread: 32
memory: 
  - type: 'node'
    dim_time: 100
    deliver_to: 'self'
    mail_combine: 'last'
    memory_update: 'hygru'
    mailbox_size: 1
    combine_node_feature: True
    dim_out: 100
    c1: 0.000000001
    Mani: 'PoincareBall'
    bias: True
train:
  - epoch: 100
    batch_size: 600
    # reorder: 16
    lr: 0.0001
    dropout: 0.2
    att_dropout: 0.2
    all_on_gpu: True
    cuda: 1
    optimizer: 'Adam'
    lr_reduce_freq: 5
    gamma: 0.1 
gnn:
  - arch: 'HyperbolicTransformer'
    layer: 1
    att_head: 2
    dim_time: 100
    dim_out: 100
    manifold: 'PoincareBall' #'PoincareBall' #'Hyperboloid' #
    c: 0.000000001
    num_layers: 1
    bias: 1
    act: 'LeakyReLU'
    task: 'lp'
